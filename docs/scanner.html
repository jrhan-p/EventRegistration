<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Event scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--green:#1d4a38;--green2:#123325;--gold:#c9a227;--goldsoft:#e6c96b;--cream:#faf6ec;--ink:#26221a;--muted:#8a8272;--ok:#1a7f4e;--bad:#b3261e}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--cream);margin:0;color:var(--ink);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
header{background:linear-gradient(150deg,var(--green),var(--green2));color:#fff;padding:12px 16px 13px;flex:none}
.brand{display:flex;align-items:center;gap:7px}
.brand .spark{color:var(--goldsoft);font-size:12px}
.brand span.t{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}
h1{font-family:'Fraunces',Georgia,serif;font-size:21px;margin:0;font-weight:700}
.chip{flex:none;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:var(--gold);color:#2e2400}
.chip.meal{background:#e28b3d;color:#331c00}
.ev{opacity:.85;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;position:relative;background:#0c1f16;min-height:0}
#reader{position:absolute;inset:0}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#camhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfe0d6;font-size:14px;text-align:center;padding:24px;line-height:1.6}
footer{flex:none;background:var(--green2);color:#cfe0d6;display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:13px;gap:10px}
footer a{color:var(--goldsoft);text-decoration:none;font-weight:600}
.screen{position:fixed;inset:0;background:var(--cream);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.screen .spark{color:var(--gold);font-size:22px}
.screen .t{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.screen h2{font-family:'Fraunces',Georgia,serif;font-size:26px;margin:14px 0 4px}
.screen .sub{color:var(--muted);font-size:15px;margin-bottom:20px;min-height:20px}
.screen input{width:min(320px,86vw);font-size:24px;text-align:center;letter-spacing:10px;padding:13px;border-radius:13px;border:1px solid #ddd6c4;background:#fff}
.screen input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.screen button{width:min(320px,86vw);margin-top:14px;font-size:17px;padding:14px;border-radius:13px;border:0;background:var(--green);color:#fff;font-weight:700}
.err{color:var(--bad);font-size:14px;margin-top:12px;min-height:18px}
#pop{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:22px;background:#12100bc9}
#pop .box{background:#fff;border-radius:22px;max-width:420px;width:100%;padding:28px 22px 22px;text-align:center;position:relative;overflow:hidden}
#pop .icon{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;font-weight:700}
#pop.ok .icon{background:var(--ok)}#pop.bad .icon{background:var(--bad)}
#pop .msg{font-weight:700;font-size:19px}
#pop.ok .msg{color:var(--ok)}#pop.bad .msg{color:var(--bad)}
#pop .who{font-family:'Fraunces',Georgia,serif;font-size:30px;margin-top:8px}
#pop .meal{font-family:'Fraunces',Georgia,serif;font-size:40px;color:#8a5a00;margin-top:8px}
#pop .diet{background:#fdf3e0;border-radius:10px;padding:9px 12px;font-size:16px;margin-top:12px;display:none}
#pop .small{color:var(--muted);font-size:13px;margin-top:12px}
#pop .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--gold);width:100%;transform-origin:left}
#pop.run .bar{animation:shrink 3.5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
#manualOv{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#12100bc9;padding:22px}
#manualOv .box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:20px}
#manualOv b{font-family:'Fraunces',Georgia,serif;font-size:19px}
#manualOv input{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid #ddd6c4;margin-top:12px}
#manualOv button{width:100%;font-size:16px;padding:12px;border-radius:10px;border:0;margin-top:10px;background:var(--green);color:#fff;font-weight:700}
#manualOv button.gray{background:#6d675a}
</style></head><body>
<header>
 <div class="brand"><span class="spark">&#10022;</span><span class="t">RCCC Community Events</span></div>
 <div class="hrow"><h1 id="title">Check-in</h1><span class="chip" id="chip">Front desk</span></div>
 <div class="ev" id="evname">&nbsp;</div>
</header>
<div id="stage"><div id="camhint">Starting camera&hellip;</div><div id="reader"></div></div>
<footer><span>Point the camera at a guest's QR code</span><span><a href="#" onclick="openManual();return false">Enter code</a>&nbsp;&middot;&nbsp;<a href="#" onclick="signOut();return false">Sign out</a></span></footer>

<div class="screen" id="login">
 <div class="spark">&#10022;</div><div class="t">RCCC Community Events</div>
 <h2 id="ltitle">Operator sign-in</h2>
 <div class="sub" id="lsub">&nbsp;</div>
 <input id="pin" inputmode="numeric" type="password" placeholder="PIN" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
 <button onclick="login()">Unlock</button>
 <div class="err" id="lerr"></div>
</div>

<div id="pop" onclick="closePop()"><div class="box">
 <div class="icon" id="picon">&#10003;</div>
 <div class="msg" id="pmsg"></div>
 <div class="who" id="pwho"></div>
 <div class="meal" id="pmeal"></div>
 <div class="diet" id="pdiet"></div>
 <div class="small" id="psmall"></div>
 <div class="bar"></div>
</div></div>

<div id="manualOv"><div class="box"><b>Enter code manually</b>
 <input id="manual" placeholder="QR value or registration token" onkeydown="if(event.key==='Enter')submitManual()">
 <button onclick="submitManual()">Process</button>
 <button class="gray" onclick="closeManual()">Cancel</button>
</div></div>

<script>
const q=new URLSearchParams(location.search);
const MODE=q.get('mode')==='meal'?'meal':'checkin';
const MEETING=(q.get('meeting')||'MAIN').trim();
const EVENT=(q.get('event')||'').trim();
const API=q.get('api')||'https://script.google.com/macros/s/AKfycbytJhW6z4YiRgiGV6YnuZ9uOoJBhl9eRiaDmYd1c07PAjC053i1gneCyOOX68Cg5MKFUQ/exec';
const PINKEY='rccc-pin-'+MODE;
let qr=null,frozen=false,popTimer=null,lastToken='',lastAt=0,pinMem='';

function api(params){return fetch(API,{method:'POST',body:new URLSearchParams(params)}).then(function(r){return r.json()})}
function getPin(){try{return localStorage.getItem(PINKEY)||pinMem}catch(e){return pinMem}}
function setPin(v){pinMem=v;try{localStorage.setItem(PINKEY,v)}catch(e){}}
function clearPin(){pinMem='';try{localStorage.removeItem(PINKEY)}catch(e){}}
function hint(t){const h=document.getElementById('camhint');h.style.display='flex';h.textContent=t}

function boot(){
 document.getElementById('title').textContent=MODE==='meal'?'Meal pickup':'Check-in';
 const chip=document.getElementById('chip');chip.textContent=MODE==='meal'?'Kitchen':'Front desk';
 if(MODE==='meal')chip.classList.add('meal');
 if(!EVENT){hint('This link is missing its event. Open the scanner from its link in the admin console.');return}
 api({fn:'eventInfo',event:EVENT,meeting:MEETING}).then(function(r){if(r&&r.ok){
  let line=r.name;
  if(MODE==='checkin'&&r.meetingName&&r.meetingName!=='Main check-in')line=r.meetingName+' · '+r.name;
  document.getElementById('evname').textContent=line;
  document.getElementById('lsub').textContent=line;
 }}).catch(function(){});
 if(getPin()){startScanning()}else{showLogin()}
}
function showLogin(msg){document.getElementById('login').style.display='flex';document.getElementById('lerr').textContent=msg||''}
function login(){const p=document.getElementById('pin').value.trim();if(!p)return;
 document.getElementById('lerr').textContent='';
 api({fn:'verifyPin',pin:p,mode:MODE}).then(function(r){
  if(r&&r.ok){setPin(p);document.getElementById('login').style.display='none';startScanning()}
  else document.getElementById('lerr').textContent=(r&&r.message)||'Incorrect PIN.'})
 .catch(function(e){document.getElementById('lerr').textContent='Network error: '+e})}
function signOut(){clearPin();location.reload()}

function startScanning(){
 if(/MicroMessenger|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent)){
  hint('This in-app browser blocks the camera. Tap ··· and choose Open in Browser / Safari.');return}
 if(!window.Html5Qrcode){hint('Camera library failed to load. Use “Enter code” below.');return}
 if(qr)return;
 qr=new Html5Qrcode('reader');
 const box=Math.round(Math.min(window.innerWidth,window.innerHeight)*0.62);
 qr.start({facingMode:'environment'},{fps:8,qrbox:{width:box,height:box}},onScan,function(){})
  .then(function(){document.getElementById('camhint').style.display='none'})
  .catch(function(e){qr=null;hint('Camera could not start ('+((e&&e.name)||e)+'). Use “Enter code” below, or check Settings → Safari → Camera.')})
}
function onScan(text){const now=Date.now();
 if(frozen)return;
 if(text===lastToken&&now-lastAt<3500)return;
 lastToken=text;lastAt=now;
 process(text)}
function openManual(){document.getElementById('manualOv').style.display='flex';document.getElementById('manual').focus()}
function closeManual(){document.getElementById('manualOv').style.display='none'}
function submitManual(){const v=document.getElementById('manual').value.trim();if(!v)return;
 document.getElementById('manual').value='';closeManual();process(v)}
function process(value){frozen=true;try{if(qr)qr.pause(true)}catch(e){}
 api({fn:'scan',value:value,pin:getPin(),mode:MODE,event:EVENT,meeting:MEETING})
 .then(function(r){if(r&&r.code==='UNAUTHORIZED'){clearPin();resume();showLogin('PIN no longer valid — sign in again.');return}showPop(r)})
 .catch(function(e){showPop({ok:false,message:'Network error: '+e})})}
function fmtTime(v){try{const d=new Date(v);if(!isNaN(d))return d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){}return String(v)}
function showPop(r){const pop=document.getElementById('pop');
 pop.className=(r.ok?'ok':'bad');pop.style.display='flex';
 document.getElementById('picon').innerHTML=r.ok?'&#10003;':'&#10005;';
 document.getElementById('pmsg').textContent=r.message||'Unknown result';
 document.getElementById('pwho').textContent=r.fullName||'';
 document.getElementById('pmeal').textContent=(MODE==='meal'&&r.mealSelected)?r.mealSelected:'';
 const diet=document.getElementById('pdiet');
 if(MODE==='meal'&&r.dietaryNotes){diet.style.display='block';diet.textContent='Dietary note: '+r.dietaryNotes}else{diet.style.display='none'}
 document.getElementById('psmall').textContent=[r.registrationId||'',r.priorAt?('previously: '+fmtTime(r.priorAt)):''].filter(Boolean).join(' · ');
 void pop.offsetWidth;pop.classList.add('run');
 clearTimeout(popTimer);popTimer=setTimeout(closePop,3500)}
function closePop(){clearTimeout(popTimer);const pop=document.getElementById('pop');pop.style.display='none';pop.classList.remove('run');resume()}
function resume(){frozen=false;try{if(qr)qr.resume()}catch(e){}}
boot();
</script></body></html>
